[package]
name = "rs-histver"
version = "0.4.2"
edition = "2021"
rust-version = "1.75"
description = "Library for querying Rust historical release versions (stable/beta/nightly)"
authors = ["RyenLee"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RyenLee/rs-histver"
homepage = "https://github.com/RyenLee/rs-histver"
documentation = "https://docs.rs/rs-histver"
readme = "README.md"
keywords = ["rust", "versions", "release", "stable", "nightly"]
categories = ["development-tools"]
include = [
    "src/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "rs_histver"
path = "src/lib.rs"

[[bin]]
name = "rs-histver"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:comfy-table"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "native-tls", "system-proxy"], default-features = false }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex-lite = "0.1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
comfy-table = { version = "7", optional = true }
[package]
name = "rs-histver"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to query Rust historical release versions with local redb cache"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RyenLee/rs-histver"
homepage = "https://github.com/RyenLee/rs-histver"
readme = "README.md"
keywords = ["rust", "versions", "cli", "release"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "config.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[bin]]
name = "rs-histver"
path = "src/main.rs"

[dependencies]
redb = "4.1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
comfy-table = "7"
regex-lite = "0.1"
toml = "0.8"
async-trait = "0.1"
